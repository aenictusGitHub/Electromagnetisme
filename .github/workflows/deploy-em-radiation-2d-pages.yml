name: Deploy EM radiation 2D to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'em-radiation-2d/**'
      - 'quadrupolar-radiation-2d/**'
      - '.github/workflows/deploy-em-radiation-2d-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            em-radiation-2d/pnpm-lock.yaml
            quadrupolar-radiation-2d/pnpm-lock.yaml

      - name: Install EM radiation 2D dependencies
        working-directory: em-radiation-2d
        run: pnpm install --frozen-lockfile

      - name: Build EM radiation 2D
        working-directory: em-radiation-2d
        run: pnpm build:pages

      - name: Install quadrupolar radiation dependencies
        working-directory: quadrupolar-radiation-2d
        run: pnpm install --frozen-lockfile

      - name: Build quadrupolar radiation 2D
        working-directory: quadrupolar-radiation-2d
        run: pnpm build:pages

      - name: Assemble GitHub Pages
        run: |
          mkdir -p pages-artifact/quadrupolar-radiation-2d
          cp -R em-radiation-2d/dist/pages/. pages-artifact/
          cp -R quadrupolar-radiation-2d/dist/pages/. pages-artifact/quadrupolar-radiation-2d/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
